<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倉農ミニ庭園 ポスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* A4縦・そのまま「印刷 → PDFに保存」できるレイアウト */
@page{size:A4 portrait;margin:0}
:root{--green:#2f7d3b;--green-d:#1f5a2a;--leaf:#8cc36a;--pink:#e9738f;--sun:#f2b84b;--cream:#f7f5ec;--ink:#24321f}
*{box-sizing:border-box}
html,body{margin:0;background:#888}
body{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:210mm;height:297mm;margin:10mm auto;background:var(--cream);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media print{html,body{background:none}.sheet{margin:0}}

.top{background:linear-gradient(170deg,#3d8f45,#1f5a2a);color:#fff;padding:16mm 14mm 26mm;text-align:center;position:relative}
.top .school{display:inline-block;background:#fff;color:var(--green-d);font-weight:700;font-size:13pt;padding:1.5mm 7mm;border-radius:99px}
.top .fair{font-size:20pt;font-weight:700;letter-spacing:.15em;margin-top:8mm}
.top h1{font-size:64pt;line-height:1.1;margin:2mm 0 0;font-weight:900;letter-spacing:.04em}
.top .wave{position:absolute;left:0;bottom:-1px;width:100%;height:18mm;display:block}

.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14mm;text-align:center}
.catch{font-size:22pt;font-weight:900;line-height:1.5;margin:0}
.catch em{font-style:normal;color:var(--pink)}
.qrbox{margin-top:9mm;display:flex;align-items:center;gap:10mm;background:#fff;border-radius:8mm;padding:8mm 10mm;box-shadow:0 1.2mm 0 rgba(47,125,59,.15);border:.6mm solid #dfe6d3}
#qr{width:62mm;height:62mm}
#qr img,#qr canvas{width:62mm!important;height:62mm!important;display:block}
.qrtext{text-align:left}
.qrtext .scan{display:inline-block;background:var(--green);color:#fff;font-weight:900;font-size:15pt;padding:1.5mm 6mm;border-radius:99px}
.qrtext ul{list-style:none;padding:0;margin:5mm 0 0;font-size:15pt;font-weight:700;line-height:1.9}
.qrtext li::before{content:"▶";color:var(--sun);margin-right:2.5mm;font-size:.8em}
.qrtext small{display:block;margin-top:3mm;font-size:9.5pt;color:#5d6b55;font-weight:500;word-break:break-all}

.bottom{background:#fff;border-top:1.2mm solid var(--leaf);padding:8mm 14mm 10mm;display:flex;justify-content:space-between;align-items:flex-end;gap:8mm}
.bottom .when{font-size:13pt;font-weight:700;line-height:1.6}
.bottom .when b{font-size:24pt;color:var(--green-d)}
.bottom .org{text-align:right;font-size:12pt;font-weight:700;color:var(--green-d)}

.flower{position:absolute}

/* 画面上だけのツールバー */
.tool{max-width:210mm;margin:10mm auto 0;background:#fff;padding:4mm 6mm;border-radius:3mm;font:14px/1.6 sans-serif}
.tool code{background:#eee;padding:1px 4px;border-radius:3px}
@media print{.tool{display:none}}
</style>
</head>
<body>

<div class="tool">
  QRコードの飛び先：<code id="urlview"></code><br>
  印刷：Ctrl+P →「送信先：PDFに保存」または用紙A4・余白なし・<b>背景のグラフィックをON</b>
</div>

<div class="sheet">
  <div class="top">
    <span class="school">鳥取県立倉吉農業高校</span>
    <div class="fair">花と緑のフェア 2026</div>
    <h1>倉農<br>ミニ庭園</h1>
    <svg class="wave" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 22 Q50 6 100 20 T200 18 T300 22 T400 16 V40 H0Z" fill="#f7f5ec"/></svg>
    <!-- 花の飾り -->
    <svg class="flower" style="left:10mm;top:40mm;width:26mm" viewBox="0 0 40 40"><g fill="#ffc6d3"><circle cx="20" cy="9" r="8"/><circle cx="31" cy="17" r="8"/><circle cx="27" cy="30" r="8"/><circle cx="13" cy="30" r="8"/><circle cx="9" cy="17" r="8"/></g><circle cx="20" cy="20" r="5.5" fill="#f2b84b"/></svg>
    <svg class="flower" style="right:12mm;top:62mm;width:20mm" viewBox="0 0 40 40"><g fill="#ffe08a"><circle cx="20" cy="9" r="8"/><circle cx="31" cy="17" r="8"/><circle cx="27" cy="30" r="8"/><circle cx="13" cy="30" r="8"/><circle cx="9" cy="17" r="8"/></g><circle cx="20" cy="20" r="5.5" fill="#e9738f"/></svg>
    <svg class="flower" style="right:30mm;top:22mm;width:12mm" viewBox="0 0 40 40"><g fill="#fff"><circle cx="20" cy="9" r="8"/><circle cx="31" cy="17" r="8"/><circle cx="27" cy="30" r="8"/><circle cx="13" cy="30" r="8"/><circle cx="9" cy="17" r="8"/></g><circle cx="20" cy="20" r="5.5" fill="#f2b84b"/></svg>
  </div>

  <div class="mid">
    <p class="catch">生徒たちがつくった庭の<br><em>「できるまで」</em>を動画で見よう！</p>
    <div class="qrbox">
      <div id="qr"></div>
      <div class="qrtext">
        <span class="scan">スマホで読みとってね</span>
        <ul>
          <li>制作タイムラプス</li>
          <li>生徒による紹介動画</li>
          <li>ミニ庭園の見どころ</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="when"><b>10/17</b>（土）10:00〜15:30<br>東郷湖羽合臨海公園 ハワイ夢広場</div>
    <div class="org">鳥取県立<br>倉吉農業高等学校</div>
  </div>
</div>

<script>
/* ▼ 公開したサイトのURLに書きかえてください（QRコードの飛び先） */
const SITE_URL = "https://akiyamasi-arch.github.io/kurano-hana-midori-2026/";

document.getElementById("urlview").textContent = SITE_URL;
new QRCode(document.getElementById("qr"), {
  text: SITE_URL, width: 512, height: 512,
  colorDark: "#1f3a1f", colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
